<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>スマホ配置エディター | SPACEBAR Mythos Slayers</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;background:#0c0f13;color:#d7e0e8;font-family:"Segoe UI","Yu Gothic",sans-serif}
  body{display:flex;flex-direction:column;align-items:center;overflow:hidden}
  header{height:64px;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
    padding:8px 14px;background:#161b21;border-bottom:1px solid #2c3742;z-index:2}
  h1{font-size:15px;color:#f3c34a;margin:0 8px 0 0}
  button{height:32px;border:1px solid #43515e;border-radius:7px;background:#202832;color:#e8edf2;
    padding:0 10px;font-weight:700;cursor:pointer}
  button.active,button:hover{border-color:#cfab54;color:#fff}
  .note{font-size:11px;color:#9aa8b5}
  #stage{flex:1;width:100%;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden}
  #phone{position:relative;border:8px solid #222b34;border-radius:22px;background:#000;overflow:hidden;
    box-shadow:0 14px 44px rgba(0,0,0,.6)}
  iframe{position:absolute;left:0;top:0;border:0;transform-origin:top left;background:#0c0f13}
</style>
</head>
<body>
<header>
  <h1>スマホ配置エディター</h1>
  <button type="button" data-w="390" data-h="844" class="active">標準 390×844</button>
  <button type="button" data-w="360" data-h="800">小型 360×800</button>
  <button type="button" data-w="430" data-h="932">大型 430×932</button>
  <span class="note">端末の実寸で表示し、画面内だけ縮小しています</span>
</header>
<main id="stage">
  <div id="phone"><iframe id="game" title="スマホ版ユニット配置" src="index.html?showcase&amp;layout&amp;mobile"></iframe></div>
</main>
<script>
  const phone=document.getElementById("phone"),game=document.getElementById("game"),stage=document.getElementById("stage");
  let device={w:390,h:844};
  function fit(){
    const scale=Math.min(1,(stage.clientWidth-28)/device.w,(stage.clientHeight-28)/device.h);
    phone.style.width=(device.w*scale+16)+"px";phone.style.height=(device.h*scale+16)+"px";
    game.style.width=device.w+"px";game.style.height=device.h+"px";game.style.transform="scale("+scale+")";
  }
  document.querySelectorAll("button[data-w]").forEach(button=>button.addEventListener("click",()=>{
    document.querySelectorAll("button[data-w]").forEach(x=>x.classList.remove("active"));button.classList.add("active");
    device={w:Number(button.dataset.w),h:Number(button.dataset.h)};fit();
  }));
  addEventListener("resize",fit);fit();
</script>
</body>
</html>
