<!--
  忍者AdMax（680px以下のスマホ枠）を、この小さなページの中だけで読み込む。

  ポイントは script を「静的に置く」こと。
  document.write で script を差し込むと、Chrome が
  「document.write 経由の、別ドメインの、パーサを止めるスクリプト」とみなして
  回線が遅いときブロックする（chromestatus 5718547946799104）。
  初回だけ広告が出ず、リロードすると出るのはこれが原因だった。

  静的な script タグなら document.write 経由ではないので介入の対象にならない。
  タグ自身が内部で document.write を呼ぶのは、このページのパース中なので問題ない。

  さらに、ゲーム本体から隔離されるので、広告側が何をしても
  index.html が白くなることがなくなる。
-->
<script src="https://adm.shinobi.jp/s/372db9c680f72d97237d54267563e357"></script>
</body>
