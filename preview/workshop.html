<body><main>
<h1>音と動きの確認</h1>
<p>本編と同じ音・絵・動きを、その場でくり返し確認できます。ゲームのセーブとは別の確認用データで動きます。</p>
<div class="bar"><a href="./?v=review4">ゲームを遊ぶ →</a></div>
<div id="status" role="status">読み込み中…</div>
<div class="layout">
<aside class="panel">
<section><h2>成長を見くらべる</h2><p>同じ森で、1人と8人の作業量・音の重なりを比べます。</p>
<button type="button" data-scene="forest" disabled>最初の森</button>
<button type="button" data-scene="one" disabled>木こり 1人</button>
<button type="button" data-scene="eight" disabled>木こり 8人</button>
<button type="button" data-scene="army" disabled>木こり・石ほり・弓兵</button></section>
<section><h2>一打の反応</h2><p>木・石は実際の採取。画面を直接クリックしても試せます。</p>
<button type="button" data-hit="wood" disabled>木をたたく</button>
<button type="button" data-hit="stone" disabled>石をたたく</button>
<button type="button" data-sound="pickup" disabled>ひろった音</button>
<button type="button" data-sound="hire" disabled>なかまが増えた音</button>
<button type="button" data-sound="victory" disabled>たおした音</button></section>
<section><h2>重ねて確かめる</h2>
<button type="button" id="music" aria-pressed="false" disabled>曲も鳴らす：OFF</button>
<button type="button" id="pause" aria-pressed="false" disabled>動きを止める</button>
<p>止めた状態でも、上のボタンで効果音だけを鳴らせます。自動の作業音を止めたいときにも使えます。</p></section>
</aside>
<div><iframe id="game" src="index.html?lab=1&amp;capture" title="確認用のゲーム画面" allow="autoplay"></iframe><p class="note">確認用の人数は各ボタンから用意した状態です。通常の初見プレイの記録ではありません。</p></div>
</div>
</main></body></html>
