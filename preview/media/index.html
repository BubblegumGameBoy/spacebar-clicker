<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Mythos Slayers II 試遊素材</title><style>body{margin:0 auto;padding:24px;max-width:1050px;background:#15241e;color:#e7e1c7;font:16px/1.7 system-ui}a{color:#e6ce8d}h1{font-size:25px}h2{font-size:19px;margin-top:30px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}figure{margin:0}img,video{width:100%;height:auto;border:1px solid #56705c;border-radius:6px;background:#101d17}figcaption{font-size:13px}small{color:#b6c5af}video{max-height:560px}</style></head><body><h1>Mythos Slayers II — 試遊素材</h1><p><a href="../">試遊版を開く</a> · <a href="../REVIEW_EXPERIMENT.md">レビューと修正の記録</a> · <a href="../forest/media/">旧forest試作の素材</a></p><p>採る → 家へ運ぶ → 仲間を置く → 荷箱を守る → 回収を任せる。3回の襲撃を遊べる試作です。画像・動画は実際のブラウザ操作から撮影しています。</p><h2>短い動画</h2><div class="grid"><figure><video controls preload="metadata" src="harvest-and-worker.mp4"></video><figcaption>手で木を採るところから、木こりの仕事へ。<a href="harvest-and-worker.mp4" download>MP4保存</a></figcaption></figure><figure><video controls preload="metadata" src="rat-raid.mp4"></video><figcaption>通常プレイで獲得した拠点から、ネズミの群れを防衛。<a href="rat-raid.mp4" download>MP4保存</a></figcaption></figure><figure><video controls preload="metadata" src="speed-measurement.mp4"></video><figcaption>連打測定から結果まで。<a href="speed-measurement.mp4" download>MP4保存</a></figcaption></figure></div><h2>ゲーム画面</h2><div class="grid"><figure><a href="first-worker-chopping.png"><img src="first-worker-chopping.png" alt="配置した木こりが木を切る画面"></a><figcaption>最初の木こり</figcaption></figure><figure><a href="rat-pack-under-fire.png"><img src="rat-pack-under-fire.png" alt="上下の道からネズミが襲撃する画面"></a><figcaption>3回目は上下から群れ</figcaption></figure><figure><a href="rail-workshop.png"><img src="rail-workshop.png" alt="レールを建設する工房"></a><figcaption>市の報酬で回収を自動化</figcaption></figure><figure><a href="camp-earned-mobile.png"><img src="camp-earned-mobile.png" alt="スマートフォン幅の拠点"></a><figcaption>スマートフォン表示</figcaption></figure></div><h2>連打測定</h2><div class="grid"><figure><a href="measurement.png"><img src="measurement.png" alt="5秒、10秒、30秒から選ぶ連打測定"></a></figure><figure><a href="measurement-result.png"><img src="measurement-result.png" alt="連打回数と秒間回数の結果"></a></figure><figure><a href="speed-ranking.png"><img src="speed-ranking.png" alt="試遊版のランキング未接続表示"></a></figure></div><p><small>試遊版ではオンラインランキング・広告・アクセス解析は無効です。ランキング画像は実際の未接続表示です。スキルツリーは、この3Waveの導入には含めていません。撮影条件は <a href="capture.json">capture.json</a> に記録しています。</small></p></body></html>
