<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>作業場の試遊記録</title><style>body{max-width:1000px;margin:24px auto;padding:16px;background:#15241e;color:#eee5cc;font:16px/1.7 system-ui}a{color:#ecd188}img,video{max-width:100%;max-height:650px}figure{margin:24px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}</style><h1>自分でつくる作業場</h1><h2>資材を重ねて溜め、置き場を強化</h2><div class="grid"><figure><img src="compact-pile.png" alt="資材12個を同じ場所に重ねた状態"><figcaption>個別の資材を狭い場所に蓄積。初期上限は12個</figcaption></figure><figure><img src="storage-upgrade.png" alt="木石で置き場の上限を24個に強化"><figcaption>正規に採集した木石で置き場を強化</figcaption></figure><figure><img src="equipment-catalog.png" alt="コンベアと受け土台の購入一覧"><figcaption>仲間の購入欄に搬送設備を追加</figcaption></figure></div><p><a href="../">試遊する</a> · <a href="../REVIEW_EXPERIMENT.md">検証記録</a></p><p>木こりを置く場所で木の落ちる位置が変わります。落下の予告を見て、コンベアや受け土台を自分で組みましょう。襲撃は残り時間がゼロになると始まります。</p><video controls preload="metadata" src="worksite-creativity.mp4"></video><p>資材の重なり・上限改訂前に撮影。正規に集めた木石で受け土台を建て、同じ石をつかんで投入。土台から隣のコンベアを経て小屋へ届きます。実ブラウザの音つき。<a href="worksite-creativity.mp4" download>動画を保存</a> · <a href="worksite-capture.json">撮影条件</a></p><div class="grid"><figure><img src="worker-left-preview.png" alt="木こりの配置中に木の落下線を表示"><figcaption>指を離す前に落ちる場所を確認</figcaption></figure><figure><img src="worksite-platform.png" alt="受け土台と隣接するコンベア"><figcaption>広い受け口と細いコンベアをつなぐ</figcaption></figure><figure><img src="same-stone-ground.png" alt="地面にある石"><figcaption>地面の石</figcaption></figure><figure><img src="same-stone-held.png" alt="同じ見た目の石をつかんだ状態"><figcaption>つかんでも同じ石</figcaption></figure></div><p>PC・スマホで初回の採集と木こり配置、初回の自動襲撃を確認。現行版で全9襲撃を通す再検証は未完了です。広告・解析・オンラインランキングは試遊版では停止しています。</p></html>
